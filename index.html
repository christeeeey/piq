<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PIQ Insight Review</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg:#f7f7f5;--cd:#fff;--tx:#1d2330;--mu:#5d6575;--ln:#dcdfe5;--ac:#1f4e8c;--ok:#e3f3e6;--no:#fbe4e4;--wa:#fff3d6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181e;--cd:#1e222a;--tx:#e8eaf0;--mu:#a0a8b8;--ln:#343a46;--ac:#8db6f0;--ok:#1f3a27;--no:#46262a;--wa:#47391a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181e;--cd:#1e222a;--tx:#e8eaf0;--mu:#a0a8b8;--ln:#343a46;--ac:#8db6f0;--ok:#1f3a27;--no:#46262a;--wa:#47391a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p,nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.5}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:800px){.two{grid-template-columns:1fr}}
textarea{width:100%;min-height:340px;box-sizing:border-box;padding:12px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);font:17px/1.7 Georgia,serif}
input,select{padding:6px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);max-width:100%;box-sizing:border-box}
.mu{color:var(--mu);font-size:14px}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}
.add{background:var(--ok)}.del{background:var(--no);text-decoration:line-through}.bad{color:#c0392b}
blockquote{margin:4px 0;padding:2px 10px;border-left:3px solid var(--ln);color:var(--mu);font-family:Georgia,serif}
h2{font-size:20px;margin:4px 0 10px}h3{font-size:16px;margin:12px 0 4px}
.bar{height:6px;background:var(--ln);border-radius:4px}.bar i{display:block;height:6px;background:var(--ac);border-radius:4px}
</style></head><body><main id="app"></main>
<script>
const VERD={"https://admission.universityofcalifornia.edu/how-to-apply/applying-as-a-transfer/personal-insight-questions.html":"2026-11-18"};
const ORD=["req","1","2","3","4","5","6","7"];
const RUB="custom-rubric-v1",Z=" ";
const QT={req:["Required: Preparation for intended major","Please describe how you have prepared for your intended major, including your readiness to succeed in your upper-division courses once you enroll at the university."],
1:["Leadership","Describe an example of your leadership experience in which you have positively influenced others, helped resolve disputes, or contributed to group efforts over time."],
2:["Creativity","Every person has a creative side, and it can be expressed in many ways: problem solving, original and innovative thinking, and artistically, to name a few. Describe how you express your creative side."],
3:["Talent or skill","What would you say is your greatest talent or skill? How have you developed and demonstrated that talent over time?"],
4:["Educational opportunity or barrier","Describe how you have taken advantage of a significant educational opportunity or worked to overcome an educational barrier you have faced."],
5:["Significant challenge","Describe the most significant challenge you have faced and the steps you have taken to overcome this challenge. How has this challenge affected your academic achievement?"],
6:["School or community contribution","What have you done to make your school or your community a better place?"],
7:["Strong candidate for UC","Beyond what has already been shared in your application, what do you believe makes you a strong candidate for admissions to the University of California?"]};
const CHK={req:"Component A (preparation: evidence beyond a course list, own involvement) and Component B (upper-division readiness supported by preparation; understanding of academic interests) are assessed independently.",
1:"Initiative or responsibility, identifiable own contribution, influence/conflict resolution/sustained contribution as relevant, consequences or understanding. No title or definition of leadership required.",
2:"How creativity is shown, decisions/process, specific evidence, significance. Problem-solving, innovation and art all valid; do not force an engineering link.",
3:"A recognizable talent/skill, development over time, evidence it was demonstrated, personal relationship to it. No awards required.",
4:"A meaningful opportunity and/or barrier (either is enough), what the applicant did, initiative/persistence, significance for their education.",
5:"Challenge and its significance understandable, steps taken, EFFECT ON ACADEMIC ACHIEVEMENT (essential), response and perspective. Resolution not required; severity is not rewarded.",
6:"Community identified, own contribution, motivation, evidence of change or benefit. Small contributions are valid.",
7:"Reveals meaningful information not covered elsewhere, evidence for the self-assessment, fuller picture of the applicant. Confidence must be grounded; no boasting required."};
const MAX={direct:2,specific:2,insight:2,clarity:1.5,auth:1.5,focus:1};
const LAB={direct:"Direct response to the PIQ",specific:"Specificity and personal contribution",insight:"Personal insight and significance",clarity:"Clarity, logic, organization",auth:"Authenticity and individuality",focus:"Focus and efficiency"};
const SRC=[["Official UC Requirement","UC Transfer PIQs (one required + 3 of 7, 350 words each)","https://admission.universityofcalifornia.edu/how-to-apply/applying-as-a-transfer/personal-insight-questions.html"],
["Official UC Guidance","UC Transfer Comprehensive Review","https://admission.universityofcalifornia.edu/how-to-apply/applying-as-a-transfer/how-applications-are-reviewed.html"],
["Official UC Guidance","UC admissions experts: PIQ tips","https://www.universityofcalifornia.edu/news/shaping-your-personal-narrative-piq-tips-and-more-uc-admissions-experts"],
["Official UC Guidance","How UC evaluates applications","https://www.universityofcalifornia.edu/news/how-the-university-of-california-evaluates-student-applications"],
["Official UC Requirement","UC Statement of Application Integrity","https://apply.universityofcalifornia.edu/docs/StatementOfIntegrity.pdf"],
["Official UC Guidance","UCLA PIQ guidance","https://admission.ucla.edu/apply/personal-insight-questions"],
["Official UC Guidance","UCLA transfer requirements","https://admission.ucla.edu/apply/transfer/transfer-requirements"],
["Institutional Mission or Value","UCLA Samueli Engineering","https://samueli.ucla.edu/about/"],
["Institutional Mission or Value","Berkeley Engineering mission and values","https://engineering.berkeley.edu/about/mission-values/"],
["User-Provided Reference","UC PIQ Brainstorming (3-stage review, per-question prompts)","file"],
["User-Provided Reference","UCLA Transfer Zoom notes (Nov 2025 session)","file"],
["User-Provided Reference","UC Berkeley Zoom notes (Nov 2025 session)","file"]];
const RULES=`You are an evaluation-only reviewer of a UC transfer applicant's Personal Insight Question draft. NEVER write, rewrite, improve, or suggest replacement wording, outlines, stories, accomplishments, or vocabulary. Never assume experiences not in the draft. Improvement comments must be neutral questions anchored to a passage in the draft. Do not reward length, vocabulary, hardship, prestige, or school names. Grammar matters only where it blocks clarity. This is not an admissions prediction. Every quote must be copied verbatim from the draft. Return ONLY JSON.`;
const BAD=/^(add|insert|replace|rewrite|try|consider|include|use|change|write|mention|say|start|end|begin|open|close|expand)\b|\b(you could|you should|you might) (add|insert|include|write|mention|replace)\b|\b(such as an? (internship|volunteer))/i;
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wc=t=>t.trim()?t.trim().split(/\s+/).length:0,norm=t=>t.replace(/\s+/g," ").trim(),inn=(q,d)=>typeof q==="string"&&q.length>2&&norm(d).includes(norm(q));
const now=()=>new Date().toLocaleString(),uid=()=>Math.random().toString(36).slice(2,9);
let S=(()=>{try{const s=JSON.parse(localStorage.getItem("piq"));if(s&&s.p)return s}catch(e){}return{cfg:{cycle:"Fall 2027",type:"Transfer",ucla:"",ucb:""},consent:false,port:null,model:"claude-sonnet-5-5",p:[0,1,2,3].map(i=>({q:i?String(i):"req",draft:"",v:[],ev:[],fb:[]}))}})();
let tab="dash",cur=0,msg="",busy=false,cmp=[0,0],mis=false;
const save=()=>{try{localStorage.setItem("piq",JSON.stringify(S))}catch(e){}};
const P=()=>S.p[cur],lastV=p=>p.v[p.v.length-1],vById=(p,id)=>p.v.find(v=>v.id===id),vn=(p,id)=>"v"+(p.v.findIndex(v=>v.id===id)+1);
const tot=r=>Object.keys(MAX).reduce((a,k)=>a+r.scores[k].score,0),lastE=p=>p.ev[p.ev.length-1];
function go(t,i){tab=t;if(i!=null)cur=i;msg="";R()}
function note(m){msg=m;busy=false;R()}
async function ask(prompt,check){let err="";for(let i=0;i<3;i++){const r=await llm(prompt+(err?"\n\nYour previous output was discarded ("+err+"). Return compliant JSON only.":""));const c=check(r);if(c===true)return r;err=c}throw{message:"The evaluator’s output kept violating the evaluation-only rules and was discarded ("+err+")."}}
const okQ=q=>typeof q==="string"&&q.trim().endsWith("?")&&!BAD.test(q.trim())&&q.length<320;
function chkEval(r,d,withM){try{let s=r.scores;for(const k in MAX){const x=s[k];if(typeof x.score!=="number"||x.score<0||x.score>MAX[k]||x.score*2%1)return"bad score "+k;if(x.score>=MAX[k]*.75&&!(x.evidence||[]).length)return"high score without evidence";for(const e of x.evidence||[])if(!inn(e,d))return"evidence not verbatim";if(x.q&&!okQ(x.q))return"non-question feedback"}
if(!Array.isArray(r.questions)||r.questions.length<3||r.questions.length>5)return"need 3-5 questions";for(const q of r.questions)if(!okQ(q.q)||(q.quote&&!inn(q.quote,d)))return"invalid question";
for(const c of r.components||[])if(c.evidence&&!inn(c.evidence,d))return"component evidence not verbatim";for(const a of r.assertions||[])if(!inn(a.quote,d))return"assertion quote not verbatim";
if(withM)for(const u of["ucla","berkeley"])for(const m of r.mission[u]||[])if(!inn(m.quote,d))return"mission quote not verbatim";return true}catch(e){return"schema error"}}
async function evaluate(){const p=P(),d=p.draft,t=QT[p.q];if(!d.trim())return note("Write or import a draft first.");if(wc(d)>350)return note("Over 350 words: shorten it yourself before evaluating.");if(!S.consent)return note("Tick the consent box first.");
if(!lastV(p)||lastV(p).text!==d)saveV(true);const v=lastV(p);busy=true;msg="Evaluating…";R();
const major=p.q==="req"?`Intended majors: UCLA ${S.cfg.ucla||"(not set)"}; Berkeley ${S.cfg.ucb||"(not set)"}.`:"";
const pr=`${RULES}\nPIQ: "${t[1]}"\nPIQ-specific checks: ${CHK[p.q]}\n${major}\nThree-stage lens: (1) central idea, (2) complete and supported response, (3) significance and impact. Do not fabricate impact.\nScoring anchors (0.5 steps): 0 = absent; ~40% = attempted but vague or partly off-question; ~75% = clear and supported by some text evidence; full = fully answered with specific verbatim evidence. Max: direct 2, specific 2, insight 2, clarity 1.5, auth 1.5, focus 1. A response missing an essential part of the PIQ cannot get full "direct".\nDRAFT:\n"""${d}"""\nJSON schema: {"scores":{"direct":{"score":0,"evidence":["verbatim quote"],"why":"brief","limit":"uncertainty or empty","q":"optional question ending in ?"},"specific":{...},"insight":{...},"clarity":{...},"auth":{...},"focus":{...}},"components":[{"part":"essential part of the PIQ","status":"answered|partial|unanswered","evidence":"verbatim quote or empty"}],"reader":{"stated":["..."],"inferred":["..."],"notEstablished":["..."]},"assertions":[{"quote":"verbatim claim","note":"why evidence is limited"}],"questions":[{"quote":"verbatim passage","category":"unanswered component|unsupported claim|action-to-significance gap|role ambiguity|organization","priority":1,"q":"neutral question?"}]${mis?`,"mission":{"ucla":[{"theme":"","quote":"verbatim"}],"berkeley":[{"theme":"","quote":"verbatim"}]} (only themes the draft naturally shows; empty arrays allowed)`:""}}\nGive 3-5 questions ranked by: unanswered essential components, unsupported claims, missing action-significance link, role ambiguity, organization.`;
try{const r=await ask(pr,r=>chkEval(r,d,mis));p.ev.push({ver:v.id,ts:now(),rub:RUB,wc:wc(d),r});save();note("")}catch(e){note(e.message||"Evaluation failed.")}}
function saveV(q){const p=P();if(!p.draft.trim())return;if(lastV(p)&&lastV(p).text===p.draft)return;p.v.push({id:uid(),ts:now(),text:p.draft});save();if(!q)note("Version saved.")}
function sec(t,h){return`<h3>${t}</h3>${h}`}
function report(){const p=P(),e=lastE(p);if(!e)return`<div class="cd mu">No evaluation yet. Evaluation needs a saved draft, consent, and the Claude evaluator; it returns scores with quoted evidence and guiding questions only, never replacement text.</div>`;
const r=e.r,pe=p.ev[p.ev.length-2],T=tot(r);
let h=`<div class="cd"><h2>A. Overall score: ${T} / 10</h2><span class="tag">Subjective review indicator — not a UC score or admissions prediction</span><p class="mu">${e.wc} words · draft ${vn(p,e.ver)} · evaluated ${esc(e.ts)} · ${e.rub}</p>`;
for(const k in MAX){const x=r.scores[k];h+=`<div><b>${LAB[k]}</b> ${x.score}/${MAX[k]}<div class="bar"><i style="width:${x.score/MAX[k]*100}%"></i></div><div class="mu">${esc(x.why)} ${x.limit?"<i>Limit: "+esc(x.limit)+"</i>":""}</div>${(x.evidence||[]).map(q=>`<blockquote>${esc(q)}</blockquote>`).join("")}${x.q?`<div class="mu">Q: ${esc(x.q)}</div>`:""}</div>`}h+="</div>";
h+=`<div class="cd">${sec("B. Direct answer assessment",(r.components||[]).map(c=>`<div><span class="tag ${c.status==="answered"?"add":c.status==="unanswered"?"del":""}" style="text-decoration:none">${esc(c.status)}</span> ${esc(c.part)}${c.evidence?`<blockquote>${esc(c.evidence)}</blockquote>`:""}</div>`).join(""))}
${sec("C. Evidence and personal insight",(r.assertions||[]).map(a=>`<div>Claim with limited evidence:<blockquote>${esc(a.quote)}</blockquote><span class="mu">${esc(a.note)}</span></div>`).join("")||`<span class="mu">No unsupported assertions flagged.</span>`)}
${sec("D. Reader perspective",[["Explicitly stated",r.reader.stated],["Reasonably inferred",r.reader.inferred],["Not established",r.reader.notEstablished]].map(([a,b])=>`<b>${a}</b><ul>${(b||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`).join(""))}</div>`;
h+=`<div class="cd"><h3>E. Priority questions</h3>${r.questions.map((q,i)=>`<div class="cd" style="cursor:pointer" onclick="hl(${i})"><span class="tag">${esc(q.category)}</span> <span class="tag">priority ${esc(q.priority)}</span>${q.quote?`<blockquote>${esc(q.quote)}</blockquote>`:""}<b>${esc(q.q)}</b> <button onclick="event.stopPropagation();cp(${i})">Copy question</button></div>`).join("")}</div>`;
const op=p.fb.filter(f=>!["Fully addressed","Intentionally declined"].includes(f.status));
h+=`<div class="cd"><h3>F. Reviewer feedback status</h3>${p.fb.length?p.fb.map(f=>`<div>${esc(f.rev)}: <span class="tag">${esc(f.status)}</span></div>`).join(""):`<span class="mu">No comments imported.</span>`} ${op.length?`<div class="mu">${op.length} unresolved.</div>`:""}
<h3>G. Revision progress</h3>${pe?Object.keys(MAX).map(k=>{const d=r.scores[k].score-pe.r.scores[k].score;return`<div>${LAB[k]}: ${d>0?"+":""}${d}</div>`}).join("")+`<div class="mu">${vn(p,pe.ver)} → ${vn(p,e.ver)}: total ${T-tot(pe.r)>0?"+":""}${T-tot(pe.r)}. A newer draft is not assumed better; compare evidence above.</div>`:`<span class="mu">No earlier evaluation.</span>`}</div>`;
if(r.mission)h+=`<div class="cd"><h3>H. Engineering mission review (reflection only; no score effect)</h3>${["ucla","berkeley"].map(u=>`<b>${u==="ucla"?"UCLA Samueli":"UC Berkeley Engineering"}</b>${(r.mission[u]||[]).map(m=>`<div><span class="tag">${esc(m.theme)}</span><blockquote>${esc(m.quote)}</blockquote></div>`).join("")||`<div class="mu">No themes naturally supported.</div>`}`).join("")}</div>`;
h+=`<div class="cd"><h3>I. Sources</h3><div class="mu">UC question wording: Official UC Requirement (UC transfer PIQ page, checked 2026-11-18). Review stages: User-Provided Reference (UC PIQ Brainstorming). Scores, anchors and questions: Custom Evaluator Judgment (${RUB}). Official links are in the Sources tab.</div></div>`;return h}
function hl(i){const q=lastE(P()).r.questions[i];const ta=$("#ta");if(!q.quote||!ta)return;const k=ta.value.indexOf(q.quote);if(k>=0){ta.focus();ta.setSelectionRange(k,k+q.quote.length)}else note("That passage has been edited since the evaluation.")}
function cp(i){const q=lastE(P()).r.questions[i].q;try{navigator.clipboard.writeText(q)}catch(e){}}
function imp(inp){const f=inp.files[0];if(!f)return;const n=f.name.toLowerCase();const set=t=>{P().draft=t;save();R()};
if(n.endsWith(".txt"))f.text().then(set);else if(n.endsWith(".docx")&&window.mammoth)f.arrayBuffer().then(b=>mammoth.extractRawText({arrayBuffer:b})).then(r=>set(r.value)).catch(()=>note("Could not read that DOCX."));else note("Supported here: TXT and DOCX. For PDFs, paste the text.")}
function work(){const p=P(),t=QT[p.q],n=wc(p.draft);
return`<div class="mu">Workspace ${cur+1} of 4 · ${S.cfg.cycle} ${S.cfg.type}</div><div class="two"><div>
${qsel(cur)}
<div class="cd"><b>${t[0]}</b><div>${t[1]}</div><div class="mu">Wording: Official UC, checked against the UC transfer PIQ page on 2026-11-18.</div></div>
<textarea id="ta" oninput="P().draft=this.value;save();W()">${esc(p.draft)}</textarea>
<div><b id="wc" class="${n>350?"bad":""}">${n} / 350 words</b> ${n>350?"Over limit":""}</div>
<p><button class="p" onclick="saveV()">Save version</button> <label class="tag">Import TXT/DOCX <input type="file" accept=".txt,.docx" onchange="imp(this)" hidden></label></p>
<label class="mu"><input type="checkbox" ${S.consent?"checked":""} onchange="S.consent=this.checked;save()"> I consent to sending this draft and feedback to Claude (Anthropic) for evaluation.</label><br>
<label class="mu"><input type="checkbox" ${mis?"checked":""} onchange="mis=this.checked"> Include optional mission review</label><br>
<div class="mu">${aiStatus()}</div><button class="p" ${busy?"disabled":""} onclick="evaluate()">Evaluate</button> <span class="mu">${esc(msg)}</span></div>
<div>${report()}</div></div>`}
function W(){const n=wc(P().draft),e=$("#wc");if(e){e.textContent=n+" / 350 words";e.className=n>350?"bad":""}}
function dash(){return`<div class="cd"><b>Application</b><p class="mu">Intended major for UCLA <input value="${esc(S.cfg.ucla)}" oninput="S.cfg.ucla=this.value;save()" placeholder="e.g. your major"> UC Berkeley <input value="${esc(S.cfg.ucb)}" oninput="S.cfg.ucb=this.value;save()"> Cycle <input size="10" value="${esc(S.cfg.cycle)}" oninput="S.cfg.cycle=this.value;save()"> Type <input size="9" value="${esc(S.cfg.type)}" oninput="S.cfg.type=this.value;save()"></p><div class="mu">Cycle requirements shown are unverified until checked against the official UC site.</div></div>
${qpick()}<div class="g">${S.p.map((p,i)=>{const e=lastE(p),op=p.fb.filter(f=>!["Fully addressed","Intentionally declined"].includes(f.status)).length;return`<div class="cd" style="cursor:pointer" onclick="go('work',${i})"><b>${lbl(p.q)}: ${QT[p.q][0]}</b><div class="mu">${esc(QT[p.q][1].slice(0,90))}…</div><p>Score: ${e?tot(e.r)+" / 10":"not evaluated"}<br>${wc(p.draft)} words · ${p.v.length?"saved "+vn(p,lastV(p).id):"no saved version"}<br>${op} unresolved feedback · ${p.v.length>1?p.v.length+" versions":"first draft"}</p></div>`}).join("")}</div>`}
function fbv(){const p=P();return`<h2>Feedback tracker: ${QT[p.q][0]}</h2><div class="cd">${selS()}
<input id="fr" placeholder="Reviewer label"> <input id="fd" type="date"><br><textarea id="fc" style="min-height:70px;font-size:15px" placeholder="Reviewer comment (paste as received)"></textarea><input id="fp" style="width:100%" placeholder="Draft passage it refers to (copy exactly)"><br>
<button class="p" onclick="addFb()">Import comment</button> <span class="mu">${esc(msg)}</span></div>
${p.fb.map((f,i)=>`<div class="cd"><b>${esc(f.rev)}</b> <span class="tag">${esc(f.status)}</span> <span class="mu">received ${esc(f.date)} · original ${vn(p,f.ver)}${f.revVer?" · revised "+vn(p,f.revVer):""}</span><div>${esc(f.text)}</div>${f.passage?`<blockquote>${esc(f.passage)}</blockquote>`:""}
<select onchange="S.p[${cur}].fb[${i}].dec=this.value;if(this.value==='Declined'){S.p[${cur}].fb[${i}].status='Intentionally declined'}save();R()">${["Undecided","Will apply","Declined"].map(o=>`<option ${f.dec===o?"selected":""}>${o}</option>`).join("")}</select>
<button onclick="chkFb(${i})" ${busy||f.dec==="Declined"?"disabled":""}>Check against latest version</button>
${f.res?`<div class="mu">Implementation: ${esc(f.res.implementation)} · Effectiveness: ${esc(f.res.effectiveness)}<br>${esc(f.res.why)}</div>${(f.res.evidence||[]).map(q=>`<blockquote>${esc(q)}</blockquote>`).join("")}${f.res.q?`<b>${esc(f.res.q)}</b>`:""}`:""}</div>`).join("")}`}
const selS=()=>"";
function addFb(){const p=P(),v=lastV(p);if(!v)return note("Save a version first so the comment is tied to a draft version.");const t=$("#fc").value.trim();if(!t)return;p.fb.push({id:uid(),rev:$("#fr").value||"Reviewer",text:t,passage:$("#fp").value,date:$("#fd").value||new Date().toLocaleDateString(),ver:v.id,dec:"Undecided",status:"Not addressed"});save();R()}
async function chkFb(i){const p=P(),f=p.fb[i],o=vById(p,f.ver),n=lastV(p);if(!S.consent)return note("Tick the consent box in a workspace first.");if(o.id===n.id)return note("Save a revised version first.");busy=true;msg="Checking…";R();
const pr=`${RULES}\nCompare the ORIGINAL and REVISED drafts against a reviewer comment. Do not assume the reviewer is correct. A wording change alone is not proof of improvement. Separate implementation (was a change made in response?) from effectiveness (did it resolve the concern?). Quote verbatim from either draft.\nPIQ: "${QT[p.q][1]}"\nCOMMENT: ${f.text}\nPASSAGE: ${f.passage}\nORIGINAL:"""${o.text}"""\nREVISED:"""${n.text}"""\nJSON: {"status":"Fully addressed|Partially addressed|Not addressed|Unable to determine","implementation":"yes|partly|no|unclear","effectiveness":"resolved|partly|not resolved|unclear","why":"brief","evidence":["verbatim quote"],"q":"guiding question ending in ? or empty"}`;
try{const r=await ask(pr,r=>{if(!["Fully addressed","Partially addressed","Not addressed","Unable to determine"].includes(r.status))return"bad status";for(const e of r.evidence||[])if(!inn(e,o.text)&&!inn(e,n.text))return"evidence not verbatim";if(r.q&&!okQ(r.q))return"non-question";return true});f.status=r.status;f.res=r;f.revVer=n.id;save();note("")}catch(e){note(e.message)}}
function diff(a,b){const x=a.split(/(\s+)/),y=b.split(/(\s+)/),m=x.length,n=y.length,L=Array.from({length:m+1},()=>new Uint16Array(n+1));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);let i=0,j=0,h="";while(i<m&&j<n){if(x[i]===y[j]){h+=esc(x[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1])h+=`<span class="del">${esc(x[i++])}</span>`;else h+=`<span class="add">${esc(y[j++])}</span>`}while(i<m)h+=`<span class="del">${esc(x[i++])}</span>`;while(j<n)h+=`<span class="add">${esc(y[j++])}</span>`;return h}
function verv(){const p=P(),v=p.v;if(v.length<2)return`<h2>Version history</h2><div class="mu">Save at least two versions of ${QT[p.q][0]} to compare.</div>${v.map((x,i)=>`<div class="cd">v${i+1} · ${esc(x.ts)}</div>`).join("")}`;let a=Math.min(cmp[0],v.length-1),b=cmp[1]&&cmp[1]<v.length?cmp[1]:v.length-1;const o=k=>v.map((x,i)=>`<option value="${i}" ${i===k?"selected":""}>v${i+1} · ${esc(x.ts)}</option>`).join("");
return`<h2>Version history: ${QT[p.q][0]}</h2><select onchange="cmp[0]=+this.value;R()">${o(a)}</select> → <select onchange="cmp[1]=+this.value;R()">${o(b)}</select><div class="cd" style="font-family:Georgia,serif;font-size:17px;white-space:pre-wrap">${diff(v[a].text,v[b].text)}</div><div class="mu">Highlights only; the saved texts are never altered. Evaluations: ${p.ev.map(e=>vn(p,e.ver)+" = "+tot(e.r)).join(" · ")||"none"}</div>`}
function grams(t){const w=t.toLowerCase().replace(/[^\w\s]/g,"").split(/\s+/).filter(Boolean),s=new Set;for(let i=0;i+5<=w.length;i++)s.add(w.slice(i,i+5).join(" "));return s}
function portv(){const ds=S.p.map(p=>p.draft),G=ds.map(grams);let ov="";for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){const sh=[...G[i]].filter(g=>G[j].has(g));if(sh.length)ov+=`<div class="cd">Workspaces ${i+1} and ${j+1} share ${sh.length} repeated 5-word phrase(s), e.g. <blockquote>${esc(sh[0])}</blockquote><b>Does the repetition serve a distinct purpose in each response?</b></div>`}
return`<h2>Portfolio review</h2><div class="g">${S.p.map((p,i)=>`<div class="cd">${QT[p.q][0]}<br>${wc(p.draft)} words · ${p.draft.trim()?"drafted":"empty"}${p.q==="req"&&wc(p.draft)<1?"<br><b class=bad>Required question not drafted</b>":""}</div>`).join("")}</div>${ov||`<div class="mu">No repeated phrases found (local check, no AI).</div>`}
<p><button class="p" ${busy?"disabled":""} onclick="portAI()">AI portfolio read</button> <span class="mu">${esc(msg)}</span></p>${S.port?`<div class="cd">${S.port.obs.map(o=>`<div>${esc(o.note)}${o.quote?`<blockquote>${esc(o.quote)}</blockquote>`:""}</div>`).join("")}${S.port.questions.map(q=>`<div><b>${esc(q)}</b></div>`).join("")}</div>`:""}`}
async function portAI(){if(!S.consent)return note("Tick the consent box in a workspace first.");const all=S.p.map(p=>p.draft).join("\n");if(!all.trim())return note("No drafts yet.");busy=true;msg="Reading…";R();
const pr=`${RULES}\nReview these four PIQ drafts as a set. Note whether each question is answered, distinct information, repeated details, consistency of voice, and the overall picture. Do not suggest new topics; do not require equal coverage.\n${S.p.map((p,i)=>`[${i+1}] "${QT[p.q][1]}"\n"""${p.draft}"""`).join("\n")}\nJSON: {"obs":[{"note":"neutral observation","quote":"verbatim or empty"}],"questions":["neutral question ending in ?"]}`;
try{S.port=await ask(pr,r=>{for(const o of r.obs||[])if(o.quote&&!inn(o.quote,all))return"quote not verbatim";for(const q of r.questions||[])if(!okQ(q))return"non-question";return Array.isArray(r.obs)&&Array.isArray(r.questions)||"schema"});save();note("")}catch(e){note(e.message)}}
function srcv(){return`<h2>Source library</h2><div class="mu">Precedence: official requirements > official guidance > campus guidance > missions > your notes > evaluator judgment. Only the UC transfer PIQ page has a recorded verification date; treat the rest as unverified until you open the link.</div>${SRC.map((s,i)=>`<div class="cd"><span class="tag">${i<9?i+1:5}</span> <span class="tag">${s[0]}</span> <b>${s[1]}</b><br>${s[2]==="file"?`<span class="mu">Your uploaded notes. Unverified, not official policy; any brainstormed experiences in them are unconfirmed.</span>`:`<a href="${s[2]}" target="_blank" rel="noopener">${s[2]}</a> <span class="mu">verified: ${VERD[s[2]]||"not yet"}</span>`}</div>`).join("")}`}
function ex(kind){const d=kind==="d"?S.p.map(p=>({question:QT[p.q][1],draft:p.draft,versions:p.v})):{evaluations:S.p.map(p=>p.ev),feedback:S.p.map(p=>p.fb)};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,1)],{type:"application/json"}));a.download=kind==="d"?"piq-drafts.json":"piq-ai-feedback.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function privv(){return`<h2>Privacy and authorship</h2><div class="cd"><ul><li><b>Where drafts live:</b> only in this browser (localStorage). Not synced; clearing browser data deletes them, so export backups.</li><li><b>External AI:</b> Evaluate, feedback checks and the portfolio read send the relevant draft text directly from your browser to Anthropic’s API (api.anthropic.com) using your own API key, only after you tick consent. There is no server of mine in between. Retention and training terms are Anthropic’s and are not verified here; check Anthropic’s privacy policy and your API account settings.</li><li><b>Without AI:</b> writing, word count, versions, diffs, feedback tracking, and the local overlap check all work offline.</li><li><b>Authorship:</b> output is validated to scores, quoted evidence, statuses and questions; anything that reads as replacement writing is discarded and re-requested. Every word of the essay stays yours. No AI-detection claims are made.</li></ul>${keyUI()}<button onclick="ex('d')">Export drafts (JSON)</button> <button onclick="ex('f')">Export AI feedback separately</button> <button onclick="if(this.dataset.s){S.p.forEach(p=>{p.draft='';p.v=[];p.ev=[];p.fb=[]});S.port=null;save();go('dash')}else{this.dataset.s=1;this.textContent='Click again to delete everything'}">Delete all data</button> <span class="mu">${esc(msg)}</span></div>`}
const isT=()=>/transfer/i.test(S.cfg.type),lbl=k=>k==="req"?"Required":"Optional "+k;
const okQ2=(i,k)=>{const u=S.p.some((p,j)=>j!==i&&p.q===k);if(u)return false;if(isT())return i===0?k==="req":k!=="req";return true};
const qsel=i=>`<select aria-label="Question for workspace ${i+1}" onchange="setQ(${i},this.value)">${ORD.map(k=>`<option value="${k}" ${S.p[i].q===k?"selected":""} ${S.p[i].q!==k&&!okQ2(i,k)?"disabled":""}>${lbl(k)}: ${QT[k][0]}</option>`).join("")}</select>`;
function setQ(i,k){S.p[i].q=k;save();R()}
const qpick=()=>`<div class="cd"><b>Choose your four PIQs</b><div class="mu">UC transfer applicants answer the one required question plus any 3 of the 7 optional questions (official UC page, checked 2026-11-18). All questions are weighed equally by UC. Questions already chosen in another workspace are greyed out. Changing a question keeps your draft text, but earlier evaluations were scored against the previous question.</div>${S.p.map((p,i)=>`<p style="margin:6px 0">Workspace ${i+1}: ${qsel(i)}</p>`).join("")}</div>`;
let KEY="";try{KEY=sessionStorage.getItem("piqkey")||""}catch(e){}
const hasS=()=>!!(window.claude&&window.claude.use);
async function llm(prompt){if(hasS()){try{const s=await claude.use("sample");if(s)return await s.json(prompt,{cache:false})}catch(e){if(!KEY)throw e}}
if(!KEY)throw{message:"No AI connection. Add your own Anthropic API key in the Privacy tab, or keep using the app without AI."};
let res;try{res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":KEY,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:S.model||"claude-sonnet-5-5",max_tokens:4000,messages:[{role:"user",content:prompt}]})})}catch(e){throw{message:"Could not reach the Anthropic API (network problem or blocked by the browser)."}}
const j=await res.json().catch(()=>({}));if(!res.ok)throw{message:"API error: "+((j.error&&j.error.message)||res.status)};
const t=(j.content||[]).map(c=>c.text||"").join("").replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,"").trim();
try{return JSON.parse(t)}catch(e){const m=t.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw{message:"The model did not return JSON."}}}
const aiStatus=()=>hasS()?"AI: Claude via this page’s host":KEY?"AI: your Anthropic API key (this tab only)":"AI: not connected (add a key in Privacy). Everything else works.";
const keyUI=()=>hasS()?"":`<div class="cd"><b>AI connection (optional)</b><div class="mu">Paste your own Anthropic API key. It stays in this browser tab (sessionStorage), is sent only to api.anthropic.com, and is never saved with your drafts or exports. Use a key with a spend limit and never commit it to GitHub.</div><input id="kk" type="password" placeholder="sk-ant-…" size="34" autocomplete="off"> Model <input value="${esc(S.model||"")}" oninput="S.model=this.value;save()" size="20"> <button onclick="setKey()">Use key</button></div>`;
function setKey(){KEY=$("#kk").value.trim();try{sessionStorage.setItem("piqkey",KEY)}catch(e){}note(KEY?"API key set for this tab.":"")}
function R(){const T=[["dash","Dashboard"],["work","Draft review"],["fb","Feedback"],["ver","Versions"],["port","Portfolio"],["src","Sources"],["priv","Privacy"]];
const sl=["work","fb","ver"].includes(tab)?`<select onchange="cur=+this.value;R()">${S.p.map((p,i)=>`<option value="${i}" ${i===cur?"selected":""}>${i+1}. ${QT[p.q][0]}</option>`).join("")}</select>`:"";
const v={dash,work,fb:fbv,ver:verv,port:portv,src:srcv,priv:privv}[tab]();
$("#app").innerHTML=`<h1 style="font-size:22px;margin:0 0 8px">PIQ Insight Review <span class="tag">evaluation only · never writes your essay</span></h1><nav>${T.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}${sl}</nav>${v}`}
R();
</script></body></html>
